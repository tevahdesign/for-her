
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gana & Vinu - Wedding Invitation</title>
      <meta name="description" content="" />
      <meta property="og:description" content="" />
      <meta name="twitter:description" content="" />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      <audio id="bg-audio" src="/background-music.mp3" autoplay loop playsinline webkit-playsinline preload="auto"></audio>
      <script>
        (function() {
          var audio = document.getElementById('bg-audio');
          if (audio) {
            audio.volume = 0.1;
            var play = function() {
              audio.play().catch(function() {});
            };
            play();
            ['pointerdown', 'touchstart', 'touchend', 'click', 'scroll', 'keydown'].forEach(function(evt) {
              window.addEventListener(evt, function() {
                if (audio.paused) play();
              }, { passive: true });
            });
          }
        })();
      </script>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
