
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gana & Vinu - Wedding Invitation</title>
      <meta name="description" content="" />
      <meta property="og:description" content="" />
      <meta name="twitter:description" content="" />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      <audio id="bg-audio" src="/background-music.mp3" autoplay loop playsinline webkit-playsinline preload="auto"></audio>
      <script>
        (function() {
          function initAudio() {
            var audio = document.getElementById('bg-audio');
            if (!audio) return;
            
            audio.volume = 0.08;
            
            var promise = audio.play();
            if (promise !== undefined) {
              promise.catch(function() {
                // Autoplay muted first (100% allowed on load by all browsers), then unmute
                audio.muted = true;
                audio.play().then(function() {
                  setTimeout(function() {
                    audio.muted = false;
                  }, 100);
                }).catch(function() {});
              });
            }

            try {
              var AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) {
                var ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                  ctx.resume().catch(function() {});
                }
              }
            } catch(e) {}
          }

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAudio);
          } else {
            initAudio();
          }
          window.addEventListener('load', initAudio);
        })();
      </script>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
