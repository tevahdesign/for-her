
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gana & Vinu - Wedding Invitation</title>
      <meta name="description" content="" />
      <meta property="og:description" content="" />
      <meta name="twitter:description" content="" />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      <audio id="bg-audio" src="/background-music.mp3" autoplay loop playsinline webkit-playsinline preload="auto"></audio>
      <button id="auto-tap-btn" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;opacity:0.0001;background:transparent;border:none;pointer-events:auto;" aria-hidden="true"></button>
      <script>
        (function() {
          var audio = document.getElementById('bg-audio');
          var tapBtn = document.getElementById('auto-tap-btn');
          var intervalId = null;

          function startMusic() {
            if (!audio) return;
            audio.volume = 0.3; // 30% volume level as requested

            var promise = audio.play();
            if (promise !== undefined) {
              promise.then(function() {
                cleanup();
              }).catch(function() {
                audio.muted = true;
                audio.play().then(function() {
                  setTimeout(function() { audio.muted = false; }, 50);
                  cleanup();
                }).catch(function() {});
              });
            }
          }

          function cleanup() {
            if (tapBtn && tapBtn.parentNode) {
              tapBtn.parentNode.removeChild(tapBtn);
            }
            if (intervalId) {
              clearInterval(intervalId);
              intervalId = null;
            }
          }

          // Auto-Tapper Logic to trick browser into starting audio without manual tap
          function autoTap() {
            startMusic();
            
            if (tapBtn) {
              try { tapBtn.click(); } catch(e) {}
              try { tapBtn.focus(); } catch(e) {}
            }
            
            try {
              var clickEvent = new MouseEvent('click', { bubbles: true, cancelable: true, view: window });
              document.body.dispatchEvent(clickEvent);
            } catch(e) {}

            try {
              var touchEvent = new TouchEvent('touchstart', { bubbles: true, cancelable: true, view: window });
              document.body.dispatchEvent(touchEvent);
            } catch(e) {}

            try {
              var pointerEvent = new PointerEvent('pointerdown', { bubbles: true, cancelable: true, view: window });
              document.body.dispatchEvent(pointerEvent);
            } catch(e) {}

            try {
              var AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) {
                var ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                  ctx.resume().catch(function() {});
                }
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                gain.gain.value = 0.001;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(0);
                osc.stop(0.001);
              }
            } catch(e) {}

            if (audio && !audio.paused && !audio.muted) {
              cleanup();
            }
          }

          startMusic();
          intervalId = setInterval(autoTap, 50);

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startMusic);
          } else {
            startMusic();
          }
          window.addEventListener('load', startMusic);
          ['mousemove', 'pointermove', 'scroll', 'touchstart', 'click', 'keydown'].forEach(function(evt) {
            window.addEventListener(evt, startMusic, { passive: true });
          });
        })();
      </script>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
